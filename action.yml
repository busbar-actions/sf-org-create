name: 'Busbar — sf-org-create'
description: 'Create a Salesforce scratch org via direct API (no sf CLI). Auths the DevHub via busbar-auth and emits the new orgs credentials.'
author: 'Busbar'

# Per the config-from-environments convention, secrets/config come from the
# GitHub Environment as env vars (consistent var names so Environments swap
# values per-env). Only operational selectors are inputs.
inputs:
  org-name:
    description: 'Org name for the new scratch.'
    required: true
  admin-email:
    description: 'Admin email for the scratch.'
    required: true
  edition:
    description: 'Edition (Developer, Enterprise, Group, Professional, Partner Developer, …).'
    required: false
    default: 'Developer'
  duration-days:
    description: 'Duration in days (1..=30).'
    required: false
    default: '7'
  namespace:
    description: 'Optional namespace.'
    required: false
    default: ''
  features:
    description: 'Optional comma-separated features list.'
    required: false
    default: ''
  description:
    description: 'Optional description.'
    required: false
    default: ''
  snapshot:
    description: 'Optional snapshot name or id (create-from-snapshot).'
    required: false
    default: ''
  poll-timeout-secs:
    description: 'Seconds to wait for the org to reach Active.'
    required: false
    default: '600'
  credentials-output:
    description: 'Path to write the resulting credentials JSON.'
    required: false
    default: '.busbar/scratch-credentials.json'
  version:
    description: 'Release tag of the sf-org-create binary (e.g. v0.1.0). "latest" resolves the most recent release.'
    required: false
    default: 'latest'
  binary-repo:
    description: 'GitHub repo hosting the prebuilt binary releases.'
    required: false
    default: 'busbar-actions/actions-dist'

outputs:
  scratch_org_info_id:
    description: 'The DevHub-side ScratchOrgInfo record id.'
    value: ${{ steps.create.outputs.scratch_org_info_id }}
  scratch_org_id:
    description: 'The created scratch orgs 15-char id.'
    value: ${{ steps.create.outputs.scratch_org_id }}
  username:
    description: 'The created scratch orgs admin username.'
    value: ${{ steps.create.outputs.username }}
  login_url:
    description: 'Login URL for the created scratch org.'
    value: ${{ steps.create.outputs.login_url }}
  credentials-path:
    description: 'Path to the JSON file containing the new orgs credential context.'
    value: ${{ inputs.credentials-output }}

# The binary owns all logic and UX: it reads its inputs from INPUT_*, auths the
# DevHub via busbar-auth (SF_*/OIDC/ECA env), creates + polls the scratch org,
# redeems the AuthCode, writes the credentials JSON, and emits GITHUB_OUTPUT, the
# step summary and an annotation. This action only installs it and passes inputs
# + auth/config env through.
runs:
  using: 'composite'
  steps:
    - name: Set up sf-org-create
      uses: busbar-actions/setup@main
      with:
        binary: sf-org-create
        version: ${{ inputs.version }}
        binary-repo: ${{ inputs.binary-repo }}

    - name: Create scratch org
      id: create
      shell: bash
      # Operational selectors arrive as INPUT_*. Auth + ECA client come from the
      # GitHub Environment (Variables, not Secrets — per config-from-environments);
      # secrets only for the access token in the local-dev fallback path.
      env:
        INPUT_ORG_NAME: ${{ inputs.org-name }}
        INPUT_ADMIN_EMAIL: ${{ inputs.admin-email }}
        INPUT_EDITION: ${{ inputs.edition }}
        INPUT_DURATION_DAYS: ${{ inputs.duration-days }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_FEATURES: ${{ inputs.features }}
        INPUT_DESCRIPTION: ${{ inputs.description }}
        INPUT_SNAPSHOT: ${{ inputs.snapshot }}
        INPUT_POLL_TIMEOUT_SECS: ${{ inputs.poll-timeout-secs }}
        INPUT_CREDENTIALS_OUTPUT: ${{ inputs.credentials-output }}
        SF_ACCESS_TOKEN: ${{ env.SF_ACCESS_TOKEN }}
        SF_INSTANCE_URL: ${{ env.SF_INSTANCE_URL }}
        # Leg-1 (OIDC → DevHub): the busbar ECA consumer key.
        BUSBAR_ECA_CLIENT_ID: ${{ env.BUSBAR_ECA_CLIENT_ID }}
        # Leg-2 (the scratch's own connected app): defaults to PlatformCLI +
        # loopback inside the binary when unset — override per-environment only
        # if a Dev Hub needs a different scratch-signup connected app.
        BUSBAR_SCRATCH_CONSUMER_KEY: ${{ env.BUSBAR_SCRATCH_CONSUMER_KEY }}
        BUSBAR_SCRATCH_CALLBACK_URL: ${{ env.BUSBAR_SCRATCH_CALLBACK_URL }}
        BUSBAR_TOKEN_HANDLER: ${{ env.BUSBAR_TOKEN_HANDLER }}
        BUSBAR_OIDC_AUDIENCE: ${{ env.BUSBAR_OIDC_AUDIENCE }}
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
      run: sf-org-create
