name: 'Busbar — sf-org-create'
description: 'Create a Salesforce scratch org via direct API (no sf CLI). Auths the DevHub via busbar-auth and emits the new orgs credentials.'
author: 'Busbar'

# Per the config-from-environments convention, secrets/config come from the
# GitHub Environment as env vars (consistent var names so Environments swap
# values per-env). Only operational selectors are inputs.
inputs:
  org-name:
    description: 'Org name for the new scratch.'
    required: true
  admin-email:
    description: 'Admin email for the scratch.'
    required: true
  edition:
    description: 'Edition (Developer, Enterprise, Group, Professional, Partner Developer, …).'
    required: false
    default: 'Developer'
  duration-days:
    description: 'Duration in days (1..=30).'
    required: false
    default: '7'
  namespace:
    description: 'Optional namespace.'
    required: false
    default: ''
  features:
    description: 'Optional comma-separated features list.'
    required: false
    default: ''
  description:
    description: 'Optional description.'
    required: false
    default: ''
  snapshot:
    description: 'Optional snapshot name or id (create-from-snapshot).'
    required: false
    default: ''
  poll-timeout-secs:
    description: 'Seconds to wait for the org to reach Active.'
    required: false
    default: '600'
  credentials-output:
    description: 'Path to write the resulting credentials JSON.'
    required: false
    default: '.busbar/scratch-credentials.json'
  version:
    description: 'Release tag of the sf-org-create binary (e.g. v0.1.0). "latest" resolves the most recent release.'
    required: false
    default: 'latest'
  binary-repo:
    description: 'GitHub repo hosting the prebuilt binary releases.'
    required: false
    default: 'busbar-actions/actions-dist'

outputs:
  scratch-org-info-id:
    description: 'The DevHub-side ScratchOrgInfo record id.'
    value: ${{ steps.create.outputs.scratch-org-info-id }}
  scratch-org-id:
    description: 'The created scratch orgs 15-char id.'
    value: ${{ steps.create.outputs.scratch-org-id }}
  username:
    description: 'The created scratch orgs admin username.'
    value: ${{ steps.create.outputs.username }}
  credentials-path:
    description: 'Path to the JSON file containing the new orgs credential context.'
    value: ${{ inputs.credentials-output }}

runs:
  using: 'composite'
  steps:
    - name: Resolve release tag
      id: tag
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ inputs.version }}" == "latest" ]]; then
          tag=$(gh release view --repo "${{ inputs.binary-repo }}" --json tagName -q .tagName)
        else
          tag="${{ inputs.version }}"
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Resolve binary asset name
      id: asset
      shell: bash
      run: |
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)   name="sf-org-create-x86_64-unknown-linux-gnu" ;;
          Linux-ARM64) name="sf-org-create-aarch64-unknown-linux-gnu" ;;
          macOS-X64)   name="sf-org-create-x86_64-apple-darwin" ;;
          macOS-ARM64) name="sf-org-create-aarch64-apple-darwin" ;;
          Windows-X64) name="sf-org-create-x86_64-pc-windows-msvc.exe" ;;
          *) echo "Unsupported runner: ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
        esac
        echo "name=$name" >> "$GITHUB_OUTPUT"

    - name: Download sf-org-create binary
      shell: bash
      run: |
        set -euo pipefail
        bin_dir="${RUNNER_TEMP}/sf-org-create"
        mkdir -p "$bin_dir"
        gh release download "${{ steps.tag.outputs.tag }}" \
          --repo "${{ inputs.binary-repo }}" \
          --pattern "${{ steps.asset.outputs.name }}" \
          --dir "$bin_dir"
        bin_path="$bin_dir/${{ steps.asset.outputs.name }}"
        chmod +x "$bin_path"
        echo "$bin_dir" >> "$GITHUB_PATH"
        if [[ "$bin_path" != "$bin_dir/sf-org-create" && "$bin_path" != "$bin_dir/sf-org-create.exe" ]]; then
          ext=""
          [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          ln -sf "$bin_path" "$bin_dir/sf-org-create$ext"
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Create scratch org
      id: create
      shell: bash
      # Auth + ECA client come from the GitHub Environment (Variables, not
      # Secrets — per config-from-environments). Secrets only for the access
      # token in the local-dev fallback path.
      env:
        SF_ACCESS_TOKEN: ${{ env.SF_ACCESS_TOKEN }}
        SF_INSTANCE_URL: ${{ env.SF_INSTANCE_URL }}
        BUSBAR_ECA_CLIENT_ID: ${{ env.BUSBAR_ECA_CLIENT_ID }}
        BUSBAR_ECA_CALLBACK_URL: ${{ env.BUSBAR_ECA_CALLBACK_URL }}
        BUSBAR_TOKEN_HANDLER: ${{ env.BUSBAR_TOKEN_HANDLER }}
        BUSBAR_OIDC_AUDIENCE: ${{ env.BUSBAR_OIDC_AUDIENCE }}
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
      run: |
        set -euo pipefail
        args=(--org-name "${{ inputs.org-name }}"
              --admin-email "${{ inputs.admin-email }}"
              --edition "${{ inputs.edition }}"
              --duration-days "${{ inputs.duration-days }}"
              --poll-timeout-secs "${{ inputs.poll-timeout-secs }}"
              --output "${{ inputs.credentials-output }}")
        [[ -n "${{ inputs.namespace }}" ]] && args+=(--namespace "${{ inputs.namespace }}")
        [[ -n "${{ inputs.features }}" ]] && args+=(--features "${{ inputs.features }}")
        [[ -n "${{ inputs.description }}" ]] && args+=(--description "${{ inputs.description }}")
        [[ -n "${{ inputs.snapshot }}" ]] && args+=(--snapshot "${{ inputs.snapshot }}")

        mkdir -p "$(dirname "${{ inputs.credentials-output }}")"
        sf-org-create "${args[@]}"

        # Echo non-secret outputs only (no token).
        jq -r '"scratch-org-info-id=" + .scratch_org_info_id' "${{ inputs.credentials-output }}" >> "$GITHUB_OUTPUT"
        jq -r '"scratch-org-id=" + .scratch_org_id'           "${{ inputs.credentials-output }}" >> "$GITHUB_OUTPUT"
        jq -r '"username=" + .username'                       "${{ inputs.credentials-output }}" >> "$GITHUB_OUTPUT"
